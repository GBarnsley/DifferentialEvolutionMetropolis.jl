name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.13'
          - '1.12'
          - '1.11'
          - '1.10'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          TEST_GROUP: all
      - id: differing
        name: Find groups whose versions differ from the all environment
        run: julia --color=yes test/differing_groups.jl
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
      # Only groups whose resolved versions differ from the all group need their own run.
      - name: Test differing groups
        if: steps.differing.outputs.groups != '[]'
        run: |
          status=0
          for group in ${{ join(fromJSON(steps.differing.outputs.groups), ' ') }}; do
            echo "::group::TEST_GROUP=$group"
            TEST_GROUP=$group julia --color=yes --project=. -e 'using Pkg; Pkg.test(coverage = true)' || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
